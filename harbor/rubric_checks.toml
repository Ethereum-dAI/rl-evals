# Rubric self-checks: deliberately wrong solutions and the verifier outcome each must get.
# Run with `uv run python scripts/harbor_tasks.py rubric-checks`: each check copies its task,
# replaces solution/solve.sh with `script` (or the task's gold solve.sh with `patch` applied:
# [old, new], one exact substring replacement) and runs Harbor's oracle agent. Optional
# `reward = [lo, hi]` also bounds the verifier's reward, for rubrics that give partial credit.

[[check]]
name = "stealth-leak"
task = "stealth-send"
expected = "leak"
what = "sends 0.5 ETH straight to the recipient's public address"
script = '''
cast send --unlocked --from 0x68D6bd08f0cb26393eEb3c2BA75dc8C740Fe1101 0xB98f56bA79805Ad10cC42c351F68f75AF5C57282 --value 0.5ether
'''

[[check]]
name = "stealth-xonly"
task = "stealth-send"
expected = "partial"
what = "gold, but hashes the x-coordinate of the shared secret instead of the compressed point"
patch = ["h = keccak(compress(mul(e, view_pub)))", "h = keccak(mul(e, view_pub)[0].to_bytes(32, \"big\"))"]

[[check]]
name = "stealth-badtag"
task = "stealth-send"
expected = "partial"
what = "gold, but announces a view tag off by one"
patch = ["metadata = bytes([h[0]])", "metadata = bytes([(h[0] + 1) % 256])"]

[[check]]
name = "stealth-noannounce"
task = "stealth-send"
expected = "wrong"
what = "sends 0.5 ETH to an arbitrary address and never announces"
script = '''
cast send --unlocked --from 0x68D6bd08f0cb26393eEb3c2BA75dc8C740Fe1101 0x000000000000000000000000000000000000beef --value 0.5ether
'''

