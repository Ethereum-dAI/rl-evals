cast send --unlocked --from 0x0C6376f228125fF2E04206361c63c61787164C3a 0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48 "transfer(address,uint256)" 0xE942322364ee9f4322E92d249fcbDCfe8A9a2f0B 380000000
cast send --unlocked --from 0xE942322364ee9f4322E92d249fcbDCfe8A9a2f0B 0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48 "transfer(address,uint256)" 0xfAa3F6a8FF36124F3033A1Bc2bfB98C15C983DCD 1000000000
