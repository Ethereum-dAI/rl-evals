[[check]]
name = "aave-partial"
task = "aave-rescue"
expected = "wrong"
reward = [0.15, 0.35]
what = "gold, but repays a quarter of the USDT: HF ~1.12, about a quarter of the gap to 1.5 closed"
patch = ['$POOL "repay(address,uint256,uint256,address)" $USDT $AMT 2', '$POOL "repay(address,uint256,uint256,address)" $USDT $((AMT / 4)) 2']

[[check]]
name = "aave-withdraw"
task = "aave-rescue"
expected = "wrong"
reward = [1.0, 1.0]
what = "gold, then withdraws 5% of the WETH collateral: HF stays ~1.67 >= 1.5, but collateral left the position"
patch = ['cast call $POOL "getUserAccountData', '''WETH=0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
COLL=$(cast call 0x0a16f2fcc0d44fae41cc54e079281d84a363becd "getUserReserveData(address,address)(uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint40,bool)" $WETH $USER | head -1 | awk '{print $1}')
cast send --unlocked --from $USER $POOL "withdraw(address,uint256,address)" $WETH $(python3 -c "print($COLL // 20)") $USER
cast call $POOL "getUserAccountData''']
