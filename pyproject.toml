[project]
name = "rl-evals"
version = "0.1.0"
description = "RL evals for wallet agents: real mainnet situations on Anvil forks, scored from chain state"
readme = "README.md"
authors = [
    { name = "gabrielfior", email = "fior.gbm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "eth-abi>=6.0.0",
    "eth-keys>=0.8.0",
    "eth-utils>=6.0.0",
    "httpx>=0.28.1",
    "pycryptodome>=3.23.0",
    "rlp>=5.0.0",
]

[project.scripts]
rl-evals = "mainnet_attack_gym:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mainnet_attack_gym"]   # import name kept from the repo's first name

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
